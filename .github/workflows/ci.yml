name: CI

on:
  push:
    branches:
      - main
      - "feat/*"
      - "codex/*"
      - "feat/**"
      - "codex/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test & Build Hardening
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Run full unit test suite
        run: npm test

      - name: Verify production build & static analysis
        run: npm run build
