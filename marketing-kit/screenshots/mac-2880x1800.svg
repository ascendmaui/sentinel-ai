family="Bricolage Grotesque" font-size="72" font-weight="700" letter-spacing="-2.520" text-anchor="start">Rogue AI agents are already probing</text><text x="120.0" y="378.0" fill="#F3EEE3" font-family="Bricolage Grotesque" font-size="72" font-weight="700" letter-spacing="-2.520" text-anchor="start">your sites and systems.</text><text x="120.0" y="468.0" fill="#9C98A8" font-family="Inter" font-size="26" font-weight="400" letter-spacing="0.000" text-anchor="start">Seraphim Scan finds the gaps before they do. Scoped security assessments in three phases: passive</text><text x="120.0" y="506.0" fill="#9C98A8" font-family="Inter" font-size="26" font-weight="400" letter-spacing="0.000" text-anchor="start">recon, a Scoped Assessment with written client authorization, and remediation with retest.</text><rect x="120" y="572" width="238.3" height="46" rx="23.0" fill="url(#mac-btn)" stroke="#F2B544" stroke-width="1"/><text x="239.2" y="601.3" fill="#1A1206" font-family="Inter" font-size="18" font-weight="600" letter-spacing="0.000" text-anchor="middle">Get the $99 Halo Scan</text><rect x="374.34375" y="572" width="177.1" height="46" rx="23.0" fill="#F3EEE3" fill-opacity="0.045" stroke="#6E6A7D" stroke-width="1"/><text x="462.9" y="601.3" fill="#F3EEE3" font-family="Inter" font-size="18" font-weight="600" letter-spacing="0.000" text-anchor="middle">See the phases</text><text x="120.0" y="654.0" fill="#9C98A8" font-family="Inter" font-size="18" font-weight="500" letter-spacing="0.000" text-anchor="start">Always scoped. Built by Ascend Maui.</text><rect x="120" y="702" width="273" height="78" rx="18" fill="#F3EEE3" fill-opacity="0.045" stroke="#F2B544" stroke-opacity="0.35"/><text x="144.0" y="736.0" fill="#F3EEE3" font-family="Inter" font-size="18" font-weight="600" letter-spacing="0.000" text-anchor="start">Free preliminary scan</text><text x="144.0" y="760.0" fill="#9C98A8" font-family="Inter" font-size="15" font-weight="400" letter-spacing="0.000" text-anchor="start">Passive, reviewed by a person</text><rect x="408.6357421875" y="702" width="229" height="78" rx="18" fill="#F3EEE3" fill-opacity="0.045" stroke="#F2B544" stroke-opacity="0.35"/><text x="432.6" y="736.0" fill="#F3EEE3" font-family="Inter" font-size="18" font-weight="600" letter-spacing="0.000" text-anchor="start">Halo Scan, $99</text><text x="432.6" y="760.0" fill="#9C98A8" font-family="Inter" font-size="15" font-weight="400" letter-spacing="0.000" text-anchor="start">Dual-verified PDF report</text><rect x="653.677734375" y="702" width="270" height="78" rx="18" fill="#F3EEE3" fill-opacity="0.045" stroke="#F2B544" stroke-opacity="0.35"/><text x="677.7" y="736.0" fill="#F3EEE3" font-family="Inter" font-size="18" font-weight="600" letter-spacing="0.000" text-anchor="start">30 minute call</text><text x="677.7" y="760.0" fill="#9C98A8" font-family="Inter" font-size="15" font-weight="400" letter-spacing="0.000" text-anchor="start">Pick a tier, confirmed by email</text><rect x="120" y="1188" width="630" height="420" rx="28" fill="#F3EEE3" fill-opacity="0.045" stroke="#F3EEE3" stroke-opacity="0.12" stroke-width="1"/><rect x="152" y="1220" width="72" height="72" rx="18" fill="url(#mac-btn)"/><text x="188.0" y="1266.0" fill="#1A1206" font-family="JetBrains Mono" font-size="16" font-weight="500" letter-spacing="0.000" text-anchor="middle">01</text><text x="152.0" y="1356.0" fill="#F3EEE3" font-family="Bricolage Grotesque" font-size="36" font-weight="600" letter-spacing="-0.720" text-anchor="start">Recon</text><text x="152.0" y="1418.0" fill="#9C98A8" font-family="Inter" font-size="24" font-weight="400" letter-spacing="0.000" text-anchor="start">Passive review of public information: the hosts</text><text x="152.0" y="1452.0" fill="#9C98A8" font-family="Inter" font-size="24" font-weight="400" letter-spacing="0.000" text-anchor="start">and exposures visible from outside.</text><rect x="774" y="1188" width="630" height="420" rx="28" fill="#F3EEE3" fill-opacity="0.045" stroke="#F3EEE3" stroke-opacity="0.12" stroke-width="1"/><rect x="806" y="1220" width="72" height="72" rx="18" fill="url(#mac-btn)"/><text x="842.0" y="1266.0" fill="#1A1206" font-family="JetBrains Mono" font-size="16" font-weight="500" letter-spacing="0.000" text-anchor="middle">02</text><text x="806.0" y="1356.0" fill="#F3EEE3" font-family="Bricolage Grotesque" font-size="36" font-weight="600" letter-spacing="-0.720" text-anchor="start">Scoped Assessment</text><text x="806.0" y="1418.0" fill="#9C98A8" font-family="Inter" font-size="24" font-weight="400" letter-spacing="0.000" text-anchor="start">Scenario design on private local models, inside</text><text x="806.0" y="1452.0" fill="#9C98A8" font-family="Inter" font-size="24" font-weight="400" letter-spacing="0.000" text-anchor="start">an agreed written scope.</text><rect x="1428" y="1188" width="630" height="420" rx="28" fill="#F3EEE3" fill-opacity="0.045" stroke="#F3EEE3" stroke-opacity="0.12" stroke-width="1"/><rect x="1460" y="1220" width="72" height="72" rx="18" fill="url(#mac-btn)"/><text x="1496.0" y="1266.0" fill="#1A1206" font-family="JetBrains Mono" font-size="16" font-weight="500" letter-spacing="0.000" text-anchor="middle">03</text><text x="1460.0" y="1356.0" fill="#F3EEE3" font-family="Bricolage Grotesque" font-size="36" font-weight="600" letter-spacing="-0.720" text-anchor="start">Remediation and Retest</text><text x="1460.0" y="1418.0" fill="#9C98A8" font-family="Inter" font-size="24" font-weight="400" letter-spacing="0.000" text-anchor="start">Ranked fixes and a retest, so closed gaps are</text><text x="1460.0" y="1452.0" fill="#9C98A8" font-family="Inter" font-size="24" font-weight="400" letter-spacing="0.000" text-anchor="start">confirmed rather than assumed.</text><rect x="2082" y="1188" width="630" height="420" rx="28" fill="#F3EEE3" fill-opacity="0.045" stroke="#F3EEE3" stroke-opacity="0.12" stroke-width="1"/><rect x="2082" y="1188" width="630" height="420" rx="28" fill="none" stroke="#F2B544" stroke-opacity="0.45"/><rect x="2114" y="1220" width="72" height="72" rx="18" fill="url(#mac-btn)"/><text x="2150.0" y="1266.0" fill="#1A1206" font-family="JetBrains Mono" font-size="18" font-weight="500" letter-spacing="0.000" text-anchor="middle">$99</text><text x="2114.0" y="1356.0" fill="#F3EEE3" font-family="Bricolage Grotesque" font-size="36" font-weight="600" letter-spacing="-0.720" text-anchor="start">Halo Scan</text><text x="2114.0" y="1418.0" fill="#9C98A8" font-family="Inter" font-size="24" font-weight="400" letter-spacing="0.000" text-anchor="start">One authorized domain. Dual-verified findings in</text><text x="2114.0" y="1452.0" fill="#9C98A8" font-family="Inter" font-size="24" font-weight="400" letter-spacing="0.000" text-anchor="start">a branded PDF report.</text>
